service: freshworks-serverless-tickets

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.12
  region: ap-south-1
  memorySize: 128
  timeout: 10
  environment:
    DYNAMODB_TABLE: FreshworksTickets
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt FreshworksTicketsTable.Arn

functions:
  ticketProcessor:
    handler: lambda_function.lambda_handler
    events:
      - httpApi:
          path: /tickets
          method: post
      - httpApi:
          path: /tickets
          method: get

resources:
  Resources:
    FreshworksTicketsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: FreshworksTickets
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: ticket_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: ticket_id
            KeyType: RANGE

outputs:
  LiveApiUrl:
    Description: "Live Invoke Endpoint"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/tickets"

